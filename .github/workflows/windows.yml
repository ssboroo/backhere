name: Windows desktop build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core and localization tests
        run: python -m unittest discover -s tests -v
      - name: Desktop UI smoke test
        run: python tests/smoke_ui.py
      - name: Install packager
        run: python -m pip install -r requirements-build.txt
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BackHere --add-data "desktop/locales.json;." desktop/backhere.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: BackHere-Windows-x64
          path: |
            dist/BackHere.exe
            installer-output/BackHere-Setup-0.1.0.exe
          if-no-files-found: error
